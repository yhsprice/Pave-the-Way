<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pave the Way Safety Challenge</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1f2933, #3b2f2f, #f59e0b);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 28px 0;
      position: relative;
      z-index: 2;
    }

    .hero {
      text-align: center;
      padding: 24px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 4rem);
      letter-spacing: 1px;
      color: #facc15;
      text-shadow: 2px 3px 0 #111827;
    }

    .hero p {
      margin: 10px auto 0;
      max-width: 850px;
      color: #fef3c7;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .panel {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
    }

    select, button, input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 2px solid #d1d5db;
      font-size: 1rem;
    }

    input {
      background: #fff;
      color: #111827;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      font-weight: 900;
      border: none;
      background: #f59e0b;
      color: #111827;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    button.secondary {
      background: #111827;
      color: white;
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .helper {
      margin: 12px 0 0;
      color: #4b5563;
      font-weight: 700;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
.hidden {
  display: none !important;
}
        .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #111827;
      color: #fff;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.92rem;
    }

    .turn-pill {
      background: #f59e0b;
      color: #111827;
    }

    .bonus-pill {
      background: #7c2d12;
      color: #fff7ed;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .score-card {
      background: #111827;
      color: #fff;
      border-radius: 16px;
      padding: 10px 12px;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 3px solid transparent;
    }

    .score-card.active {
      border-color: #f59e0b;
      color: #facc15;
      transform: scale(1.02);
    }

    .question-card {
      display: grid;
      grid-template-columns: minmax(260px, 42%) 1fr;
      gap: 20px;
      align-items: start;
    }

    .image-wrap {
      background: #111827;
      border-radius: 20px;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #f59e0b;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      max-height: 390px;
      object-fit: cover;
      display: block;
    }

    .missing-image {
      padding: 20px;
      color: #fef3c7;
      text-align: center;
      line-height: 1.5;
      font-weight: 800;
    }

    .category-banner {
      margin: 0 0 14px;
      padding: 12px 16px;
      border-radius: 18px;
      background: #111827;
      color: #facc15;
      border: 3px solid #f59e0b;
      font-weight: 900;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .stage-banner {
      margin: 0 0 12px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #fff7ed;
      border: 2px solid #f59e0b;
      color: #7c2d12;
      font-weight: 900;
      line-height: 1.35;
    }

    .question-text {
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 900;
      line-height: 1.2;
      margin: 0 0 14px;
      color: #111827;
    }

    .points-note {
      font-weight: 900;
      color: #92400e;
      margin: 0 0 12px;
    }

    .timer-wrap {
      margin: 12px 0 16px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      height: 20px;
      border: 2px solid #111827;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #f59e0b, #dc2626);
      transition: width 1s linear;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      background: #f3f4f6;
      color: #111827;
      text-align: left;
      border: 2px solid #d1d5db;
      font-weight: 900;
    }

    .answer-btn:hover {
      background: #fde68a;
    }

    .answer-btn.correct {
      background: #16a34a;
      color: white;
      border-color: #15803d;
    }

    .answer-btn.wrong {
      background: #dc2626;
      color: white;
      border-color: #991b1b;
    }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      font-weight: 900;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      background: #dcfce7;
      color: #14532d;
    }

    .feedback.bad {
      background: #fee2e2;
      color: #7f1d1d;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .controls button {
      flex: 1;
      min-width: 180px;
    }
