<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pave the Way Safety Challenge</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1f2933, #3b2f2f, #f59e0b);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 28px 0;
      position: relative;
      z-index: 2;
    }

    .hero {
      text-align: center;
      padding: 24px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 4rem);
      letter-spacing: 1px;
      color: #facc15;
      text-shadow: 2px 3px 0 #111827;
    }

    .hero p {
      margin: 10px auto 0;
      max-width: 850px;
      color: #fef3c7;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .panel {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
    }

    select, button, input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 2px solid #d1d5db;
      font-size: 1rem;
    }

    input {
      background: #fff;
      color: #111827;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      font-weight: 900;
      border: none;
      background: #f59e0b;
      color: #111827;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    button.secondary {
      background: #111827;
      color: white;
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .helper {
      margin: 12px 0 0;
      color: #4b5563;
      font-weight: 700;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
