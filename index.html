<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pave the Way Safety Challenge</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #1f2933, #3b2f2f, #f59e0b);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      width: min(1120px, 94%);
      margin: 0 auto;
      padding: 28px 0;
      position: relative;
      z-index: 2;
    }

    .hero {
      text-align: center;
      padding: 24px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 4rem);
      letter-spacing: 1px;
      color: #facc15;
      text-shadow: 2px 3px 0 #111827;
    }

    .hero p {
      margin: 10px auto 0;
      max-width: 850px;
      color: #fef3c7;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .panel {
      margin-top: 22px;
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    label {
      display: block;
      font-weight: 800;
      margin-bottom: 6px;
    }

    select, button, input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 2px solid #d1d5db;
      font-size: 1rem;
    }

    input {
      background: #fff;
      color: #111827;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      font-weight: 900;
      border: none;
      background: #f59e0b;
      color: #111827;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    button.secondary {
      background: #111827;
      color: white;
    }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .helper {
      margin: 12px 0 0;
      color: #4b5563;
      font-weight: 700;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
.hidden {
  display: none !important;
}
        .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: #111827;
      color: #fff;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.92rem;
    }

    .turn-pill {
      background: #f59e0b;
      color: #111827;
    }

    .bonus-pill {
      background: #7c2d12;
      color: #fff7ed;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .score-card {
      background: #111827;
      color: #fff;
      border-radius: 16px;
      padding: 10px 12px;
      font-weight: 900;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 3px solid transparent;
    }

    .score-card.active {
      border-color: #f59e0b;
      color: #facc15;
      transform: scale(1.02);
    }

    .question-card {
      display: grid;
      grid-template-columns: minmax(260px, 42%) 1fr;
      gap: 20px;
      align-items: start;
    }

    .image-wrap {
      background: #111827;
      border-radius: 20px;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #f59e0b;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      max-height: 390px;
      object-fit: cover;
      display: block;
    }

    .missing-image {
      padding: 20px;
      color: #fef3c7;
      text-align: center;
      line-height: 1.5;
      font-weight: 800;
    }

    .category-banner {
      margin: 0 0 14px;
      padding: 12px 16px;
      border-radius: 18px;
      background: #111827;
      color: #facc15;
      border: 3px solid #f59e0b;
      font-weight: 900;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .stage-banner {
      margin: 0 0 12px;
      padding: 10px 14px;
      border-radius: 16px;
      background: #fff7ed;
      border: 2px solid #f59e0b;
      color: #7c2d12;
      font-weight: 900;
      line-height: 1.35;
    }

    .question-text {
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 900;
      line-height: 1.2;
      margin: 0 0 14px;
      color: #111827;
    }

    .points-note {
      font-weight: 900;
      color: #92400e;
      margin: 0 0 12px;
    }

    .timer-wrap {
      margin: 12px 0 16px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      height: 20px;
      border: 2px solid #111827;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #f59e0b, #dc2626);
      transition: width 1s linear;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      background: #f3f4f6;
      color: #111827;
      text-align: left;
      border: 2px solid #d1d5db;
      font-weight: 900;
    }

    .answer-btn:hover {
      background: #fde68a;
    }

    .answer-btn.correct {
      background: #16a34a;
      color: white;
      border-color: #15803d;
    }

    .answer-btn.wrong {
      background: #dc2626;
      color: white;
      border-color: #991b1b;
    }

    .feedback {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      font-weight: 900;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      background: #dcfce7;
      color: #14532d;
    }

    .feedback.bad {
      background: #fee2e2;
      color: #7f1d1d;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .controls button {
      flex: 1;
      min-width: 180px;
    }
    .results {
      text-align: center;
    }

    .results h2 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .big-score {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 900;
      color: #f59e0b;
      text-shadow: 2px 2px 0 #111827;
      margin: 12px 0;
    }

    .champion-banner {
      max-width: 760px;
      margin: 18px auto;
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      color: #111827;
      border: 4px solid #111827;
      box-shadow: 0 14px 28px rgba(0,0,0,0.35);
      font-weight: 900;
      animation: championPulse 1.1s ease-in-out infinite alternate;
    }

    .champion-banner .title {
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .champion-banner .subtitle {
      font-size: 1.1rem;
    }

    @keyframes championPulse {
      from { transform: scale(1); }
      to { transform: scale(1.025); }
    }

    .victory-spark {
      display: inline-block;
      animation: sparkBounce 0.8s ease-in-out infinite alternate;
    }

    @keyframes sparkBounce {
      from { transform: translateY(0) rotate(-4deg); }
      to { transform: translateY(-5px) rotate(4deg); }
    }

    .leaderboard,
    .local-board {
      max-width: 820px;
      margin: 18px auto;
      display: grid;
      gap: 10px;
    }

    .leader-row,
    .local-score-row {
      display: grid;
      grid-template-columns: 60px 1fr 100px;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      background: #f3f4f6;
      color: #111827;
      font-weight: 900;
      text-align: left;
      border: 3px solid transparent;
    }

    .leader-row.winner,
    .local-score-row.top {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #111827;
    }

    .local-board-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #111827;
      margin: 22px 0 8px;
    }

    .weak-report {
      max-width: 720px;
      margin: 16px auto;
      padding: 14px;
      background: #fff7ed;
      color: #7c2d12;
      border: 3px solid #f59e0b;
      border-radius: 18px;
      font-weight: 900;
      text-align: left;
    }

    .badge-box {
      max-width: 820px;
      margin: 18px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .badge-card {
      background: #111827;
      color: #fff;
      border: 3px solid #f59e0b;
      border-radius: 18px;
      padding: 14px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      text-align: center;
    }

    .badge-icon {
      font-size: 2.1rem;
      display: block;
      margin-bottom: 6px;
    }

    .badge-name {
      color: #facc15;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .badge-desc {
      font-size: 0.85rem;
      color: #e5e7eb;
      line-height: 1.3;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999999;
    }

    @keyframes tomatoFall {
      0% {
        transform: translateY(-60px) rotate(0deg) scale(1);
        opacity: 1;
      }
      85% {
        transform: translateY(88vh) rotate(620deg) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translateY(95vh) rotate(720deg) scale(0.9);
        opacity: 1;
      }
    }

    @keyframes tomatoSplat {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    @media (max-width: 760px) {
      .question-card {
        grid-template-columns: 1fr;
      }

      .image-wrap {
        min-height: 210px;
      }

      .hero {
        padding: 18px 12px;
      }

      .hero h1 {
        font-size: clamp(1.55rem, 8vw, 2.15rem);
        white-space: nowrap;
        letter-spacing: 0;
        line-height: 1.05;
      }

      .hero p {
        font-size: 0.95rem;
        line-height: 1.45;
      }

      .category-banner {
        font-size: 1rem;
        padding: 10px 12px;
      }

      .leader-row,
      .local-score-row {
        grid-template-columns: 44px 1fr 76px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
